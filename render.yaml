services:
  - type: web
    name: nexomarket-022
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://nexomarket-0k22.onrender.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: nexomarket
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # PostgreSQL es la fuente de verdad central. En Render, crear/usar el Postgres
      # de NexoMarket y colocar su Internal Connection String aquí.
      - key: NEXOMARKET_DATABASE_URL
        sync: false
