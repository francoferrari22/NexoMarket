services:
  - type: web
    name: nexomarket-central
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://nexomarket-central.onrender.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: nexomarket
      - key: R2_PUBLIC_BASE_URL
        sync: false
