services:
  - type: web
    name: nexomarket-022
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: PUBLIC_BASE_URL
        value: https://nexomarket-0k22.onrender.com
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        value: nexomarket
      - key: R2_PUBLIC_BASE_URL
        sync: false
      # PostgreSQL es la fuente de verdad central. En Render, crear/usar el Postgres
      # de NexoMarket y colocar su Internal Connection String aquí.
      - key: NEXOMARKET_DATABASE_URL
        sync: false
      # Clave maestra para NexoMarket Super Admin. Definirla manualmente en Render.
      # Correo transaccional (opcional pero recomendado en producción).
      - key: NEXOMARKET_SMTP_HOST
        sync: false
      - key: NEXOMARKET_SMTP_PORT
        value: "587"
      - key: NEXOMARKET_SMTP_USER
        sync: false
      - key: NEXOMARKET_SMTP_PASSWORD
        sync: false
      - key: NEXOMARKET_SMTP_FROM
        sync: false
      - key: NEXOMARKET_SMTP_SSL
        value: "1"
      # Firma HMAC de webhooks del proveedor de pagos.
      - key: NEXOMARKET_PAYMENT_WEBHOOK_SECRET
        sync: false
